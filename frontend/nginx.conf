server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend service (compose network)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 20m;        # voice recordings
        proxy_read_timeout 600s;         # local LLM generation can be slow
        proxy_send_timeout 600s;
    }
}
